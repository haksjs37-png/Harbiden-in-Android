name: APK olustur
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          f=$(ls *.zip | head -1)
          unzip -q "$f"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: JARVIS-Android
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: JARVIS-Android/app/build/outputs/apk/debug/app-debug.apk
