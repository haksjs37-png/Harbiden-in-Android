name: Tek Tikla APK Uretici

on:
  workflow_dispatch: # Bu satır sayesinde site gibi buton gelecek!
  push:
    branches: [ "main", "master" ] # Dosya yükleyince de otomatik çalışsın diye ekledim

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - run: chmod +x gradlew
    - run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: Hazir-APK-Dosyan
        path: app/build/outputs/apk/debug/*.apk
